# Run BEFORE deploying the app.
# kubectl apply -f k8s/migration-job.yaml
# kubectl wait --for=condition=complete job/db-migrate -n amanat --timeout=120s
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: amanat
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Dedicated migrate image (has drizzle-kit + migration SQL); the app
          # image is a pruned standalone build and cannot run migrations.
          image: ghcr.io/rafsunx/amanat-migrate:main
          # :main is a mutable tag - always re-pull so nodes never reuse a stale
          # (e.g. pre-fix) cached image.
          imagePullPolicy: Always
          # Migrate command is baked into the image CMD (main DB + audit DB).
          envFrom:
            - secretRef:
                name: amanat-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
