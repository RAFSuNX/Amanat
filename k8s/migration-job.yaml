# Run BEFORE deploying the app.
# kubectl apply -f k8s/migration-job.yaml
# kubectl wait --for=condition=complete job/db-migrate -n amanat --timeout=120s
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: amanat
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/rafsunx/amanat:main
          command: ["sh", "-c", "npm run db:migrate && npm run db:audit:migrate"]
          envFrom:
            - secretRef:
                name: amanat-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
