services:
  app-dev:
    build:
      context: .
      target: deps
    command: sh -c "npm run db:migrate && npm run db:audit:migrate && node scripts/seed-dev.mjs; npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: postgresql://amanat:amanat_dev@postgres:5432/amanat
      AUDIT_DATABASE_URL: postgresql://amanat_audit:amanat_audit_dev@postgres-audit:5432/amanat_audit
      REDIS_URL: redis://redis:6379
      BACKUP_DATABASE_URL: postgresql://amanat:amanat_dev@postgres:5432/amanat
      REMOTE_PUBLIC_LEDGER_DATABASE_URL: postgresql://amanat:amanat_dev@postgres:5432/amanat
      NEON_DATABASE_URL: postgresql://amanat:amanat_dev@postgres:5432/amanat
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dev-secret-change-this-for-real-use-amanat-local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      R2_ENDPOINT: https://dev-placeholder.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: dev
      R2_SECRET_ACCESS_KEY: dev-secret
      R2_BUCKET_NAME: dev-bucket
      R2_KYC_BUCKET_NAME: dev-kyc-bucket
      R2_PUBLIC_URL: http://localhost:3000/dev-files
      RESEND_API_KEY: re_dev_fake_key_local_only_not_real
      RESEND_FROM_EMAIL: dev@dev.local
      SUPPORT_EMAIL: dev@localhost
      DEV_SKIP_CONNECTIVITY: "1"
      POSTGRES_PASSWORD: amanat_dev
      AUDIT_DB_PASSWORD: amanat_audit_dev
    depends_on:
      - postgres
      - postgres-audit
      - redis
