services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amanat
      POSTGRES_USER: amanat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amanat_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-audit:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amanat_audit
      POSTGRES_USER: amanat_audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-amanat_audit_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    restart: unless-stopped
    depends_on:
      - postgres
      - postgres-audit
    environment:
      DATABASE_URL: postgresql://amanat:${POSTGRES_PASSWORD:-amanat_dev}@postgres:5432/amanat
      AUDIT_DATABASE_URL: postgresql://amanat_audit:${AUDIT_DB_PASSWORD:-amanat_audit_dev}@postgres-audit:5432/amanat_audit
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://amanat:${POSTGRES_PASSWORD:-amanat_dev}@postgres:5432/amanat
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  postgres_audit_data:
  redis_data:
