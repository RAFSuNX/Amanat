services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=5", "-c", "max_wal_senders=5"]
    environment:
      POSTGRES_DB: amanat
      POSTGRES_USER: amanat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amanat_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-audit:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amanat_audit
      POSTGRES_USER: amanat_audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-amanat_audit_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  postgres_audit_data:
  redis_data:
