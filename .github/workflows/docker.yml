name: CI and build

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Stage 1: fast structural checks (the "doctor") ──────────────────────────
  # Repo sanity (migration journals, .env not tracked, scripts present) + lint +
  # typecheck. Nothing else runs until this passes.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
        timeout-minutes: 6
      - name: Doctor
        run: npm run doctor
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  # ── Stage 2: full test suite (unit + real-postgres integration) ─────────────
  # Runs only if checks pass. A live Postgres service backs the integration tests
  # so the actual SQL / distribution math is exercised, not mocked.
  test:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amanat
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amanat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amanat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://amanat:test@localhost:5432/amanat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
        timeout-minutes: 6
      - name: Run tests
        run: npm test
        timeout-minutes: 8

  # ── Stage 3: build & push images ────────────────────────────────────────────
  # Runs only if BOTH checks and tests pass. Per-step timeouts so a hung arm64
  # build under QEMU fails fast instead of stalling the job for ~50 min.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push app
        uses: docker/build-push-action@v5
        timeout-minutes: 40
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract migrate metadata
        id: migrate-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/amanat-migrate
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push migrate image
        uses: docker/build-push-action@v5
        timeout-minutes: 25
        with:
          context: .
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.migrate-meta.outputs.tags }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract backup metadata
        id: backup-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/amanat-backup
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push backup image
        uses: docker/build-push-action@v5
        timeout-minutes: 25
        with:
          context: .
          file: docker/Dockerfile.backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.backup-meta.outputs.tags }}
          labels: ${{ steps.backup-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
