name: CI and build

on:
  # Manual only - no auto-build on push. Trigger from the Actions tab or
  # `gh workflow run "CI and build"`. Releases still build.
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # ── Stage 1: fast structural checks ─────────────────────────────────────────
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
        timeout-minutes: 6
      - name: Doctor
        run: npm run doctor
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  # ── Stage 2: test suite (unit + real-postgres integration) ──────────────────
  test:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amanat
          POSTGRES_PASSWORD: test
          POSTGRES_DB: amanat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amanat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://amanat:test@localhost:5432/amanat_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
        timeout-minutes: 6
      - name: Run tests
        run: npm test
        timeout-minutes: 8

  # ── Stage 3: build each arch on its NATIVE runner (no QEMU) ─────────────────
  # amd64 and arm64 build in parallel, each pushing an arch-suffixed tag.
  # A manifest job below stitches them into the final multi-arch image.
  image:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image names
        id: names
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "repo=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          tags: ghcr.io/${{ steps.names.outputs.repo }}:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ steps.names.outputs.owner }}/amanat-migrate:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=migrate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=migrate-${{ matrix.arch }}

      - name: Build and push backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backup
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ steps.names.outputs.owner }}/amanat-backup:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=backup-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backup-${{ matrix.arch }}

  # ── Stage 4: stitch per-arch images into one multi-arch manifest ─────────────
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          sha="sha-$SHA"
          for repo in amanat amanat-migrate amanat-backup; do
            R="ghcr.io/$owner/$repo"
            docker buildx imagetools create \
              -t "$R:main" -t "$R:$sha" \
              "$R:$sha-amd64" "$R:$sha-arm64"
          done
